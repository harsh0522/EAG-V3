<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Clipboard Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<!-- ── SETUP SCREEN ─────────────────────────────────────────────────────────── -->
<div id="setup-screen" class="screen hidden">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 class="auth-title">Create Vault</h1>
    <p class="auth-sub">Set up your secure clipboard</p>

    <div class="field">
      <label>Username</label>
      <input id="su-username" type="text" placeholder="Choose a username" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="su-password" type="password" placeholder="Create a password">
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input id="su-confirm" type="password" placeholder="Repeat password">
    </div>
    <div class="field">
      <label>Security Question</label>
      <select id="su-question">
        <option value="">Select a question…</option>
        <option>What was your first pet's name?</option>
        <option>What city were you born in?</option>
        <option>What is your mother's maiden name?</option>
        <option>What was the name of your first school?</option>
        <option>What is your favourite movie?</option>
        <option>What street did you grow up on?</option>
      </select>
    </div>
    <div class="field">
      <label>Security Answer</label>
      <input id="su-answer" type="text" placeholder="Your answer" autocomplete="off">
    </div>

    <div id="su-error" class="err hidden"></div>
    <button id="su-btn" class="btn primary full">Create Account</button>
  </div>
</div>

<!-- ── LOGIN SCREEN ──────────────────────────────────────────────────────────── -->
<div id="login-screen" class="screen hidden">
  <div class="auth-card">
    <div class="auth-logo">🔐</div>
    <h1 class="auth-title">Secure Clipboard</h1>
    <p class="auth-sub">Sign in to your vault</p>

    <div class="field">
      <label>Username</label>
      <input id="li-username" type="text" placeholder="Username" autocomplete="off">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="li-password" type="password" placeholder="Password">
    </div>

    <div id="li-error" class="err hidden"></div>
    <button id="li-btn" class="btn primary full">Login</button>
    <button id="li-forgot" class="btn ghost full">Forgot Password?</button>
  </div>
</div>

<!-- ── RESET PASSWORD SCREEN ─────────────────────────────────────────────────── -->
<div id="reset-screen" class="screen hidden">
  <div class="auth-card">
    <div class="auth-logo">🔑</div>
    <h1 class="auth-title">Reset Password</h1>

    <!-- Step 1: find account -->
    <div id="rs-step1">
      <div class="field">
        <label>Username</label>
        <input id="rs-username" type="text" placeholder="Your username" autocomplete="off">
      </div>
      <div id="rs-err1" class="err hidden"></div>
      <button id="rs-find-btn" class="btn primary full">Find Account</button>
    </div>

    <!-- Step 2: answer + new password -->
    <div id="rs-step2" class="hidden">
      <div class="security-q" id="rs-question-text"></div>
      <div class="field">
        <label>Your Answer</label>
        <input id="rs-answer" type="text" placeholder="Answer" autocomplete="off">
      </div>
      <div class="field">
        <label>New Password</label>
        <input id="rs-new-pwd" type="password" placeholder="New password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input id="rs-confirm-pwd" type="password" placeholder="Confirm new password">
      </div>
      <div id="rs-err2" class="err hidden"></div>
      <button id="rs-submit-btn" class="btn primary full">Reset Password</button>
    </div>

    <button id="rs-back" class="btn ghost full" style="margin-top:8px">← Back to Login</button>
  </div>
</div>

<!-- ── DASHBOARD ─────────────────────────────────────────────────────────────── -->
<div id="dashboard-screen" class="screen hidden">

  <!-- Top bar -->
  <div class="topbar">
    <span class="topbar-title">🔐 Vault</span>
    <div class="topbar-actions">
      <button id="open-window-btn" class="icon-btn" title="Open in resizable window">⤢</button>
      <button id="dark-toggle" class="icon-btn" title="Toggle dark mode">🌙</button>
      <button id="chpwd-open" class="icon-btn" title="Change password">⚙️</button>
      <button id="logout-btn" class="icon-btn" title="Logout">🚪</button>
    </div>
  </div>

  <!-- Search + filter -->
  <div class="controls">
    <input id="search" type="text" placeholder="🔍  Search…" class="search-input">
    <select id="time-filter" class="filter-select">
      <option value="all">All time</option>
      <option value="24h">Last 24 h</option>
      <option value="2d">Last 2 days</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
      <option value="1y">Last year</option>
    </select>
  </div>

  <!-- Paste zone -->
  <div class="paste-zone-wrap">
    <textarea
      id="paste-zone"
      class="paste-zone"
      placeholder="📋  Right-click → Paste  or  ⌘V / Ctrl+V  —  works for screenshots &amp; images too"
      rows="2"
      spellcheck="false"
    ></textarea>
  </div>

  <!-- Stats row -->
  <div class="stats-row">
    <span id="item-count" class="item-count">0 items</span>
    <div class="stats-actions">
      <button id="add-note-btn" class="add-note-btn" title="Add a new note">＋ New note</button>
      <button id="clear-all" class="danger-link">Clear all</button>
    </div>
  </div>

  <!-- Inline note composer (hidden until + is clicked) -->
  <div id="note-composer" class="note-composer hidden">
    <textarea
      id="note-text"
      class="note-textarea"
      placeholder="Type your note here…"
      rows="4"
      spellcheck="true"
      autofocus
    ></textarea>
    <div class="note-composer-actions">
      <span id="note-char-count" class="char-count">0 chars</span>
      <div class="note-btns">
        <button id="note-cancel" class="btn ghost">Cancel</button>
        <button id="note-save"   class="btn primary">Save note</button>
      </div>
    </div>
  </div>

  <!-- Clipboard list -->
  <div id="clip-list" class="clip-list">
    <div id="empty-state" class="empty-state">
      <div class="empty-icon">📋</div>
      <p>No items yet.<br>Copy something to get started!</p>
    </div>
  </div>
</div>

<!-- ── CHANGE PASSWORD MODAL ─────────────────────────────────────────────────── -->
<div id="chpwd-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <span>Change Password</span>
      <button id="chpwd-close" class="close-btn">×</button>
    </div>
    <div class="field">
      <label>Current Password</label>
      <input id="cp-current" type="password" placeholder="Current password">
    </div>
    <div class="field">
      <label>New Password</label>
      <input id="cp-new" type="password" placeholder="New password">
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input id="cp-confirm" type="password" placeholder="Confirm">
    </div>
    <div id="cp-error" class="err hidden"></div>
    <button id="cp-save" class="btn primary full">Update Password</button>
  </div>
</div>

<!-- ── TOAST ─────────────────────────────────────────────────────────────────── -->
<div id="toast" class="toast hidden"></div>

<script src="utils.js"></script>
<script src="popup.js"></script>
</body>
</html>
